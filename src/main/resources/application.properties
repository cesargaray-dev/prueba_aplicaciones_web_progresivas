# Configuración de Base de Datos (Neon Postgres)
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-billowing-sound-b4r1k9ty-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require}
