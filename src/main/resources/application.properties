spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Deshabilitar chequeo de Spring Cloud Config Server (no requerido para ejecución local)
spring.cloud.config.enabled=false

# Configuración de Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# Configuración de caché de productos GestoPago
gestopago.cache.ttl-horas=1

# Timeout de sesión de inactividad: 5 minutos (300 segundos)
server.servlet.session.timeout=300
spring.session.timeout=300s

# Configuración de Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.display-request-duration=true

# Serialización de fechas: nunca usar timestamps, usar formato texto yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd

# Evitar que Jackson convierta Strings a Números automáticamente (forzar formato JSON estricto)
spring.jackson.mapper.allow-coercion-of-scalars=false

server.forward-headers-strategy=framework

