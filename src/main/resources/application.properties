# Carga opcional de variables locales desde .env (ignorado en Git)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Configuración del servicio externo (PuntoRed/GestoPago) mediante variables de entorno
gestopago.api.url=${GESTOPAGO_API_URL:https://gestopago.portalventas.net}
gestopago.api.token=${GESTOPAGO_API_TOKEN:}
gestopago.api.key=${GESTOPAGO_API_KEY:}
gestopago.api.secret-key=${GESTOPAGO_SECRET_KEY:}
gestopago.api.iv=${GESTOPAGO_IV:}
gestopago.api.unidad=${GESTOPAGO_UNIDAD:}

# Configuración del auth (existente en el proyecto por el servicio GestoPagoTokenService)
gestopago.auth.url=${GESTOPAGO_AUTH_URL:https://gestopago.portalventas.net}
gestopago.auth.id-distribuidor=${GESTOPAGO_ID_DISTRIBUIDOR:0}
gestopago.auth.codigo-dispositivo=${GESTOPAGO_CODIGO_DISPOSITIVO:}
gestopago.auth.password=${GESTOPAGO_AUTH_PASSWORD:}

# Configuración de Base de Datos (Neon Postgres)
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

# Deshabilitar chequeo de Spring Cloud Config Server (no requerido para ejecución local)
spring.cloud.config.enabled=false

# Configuración de Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# Configuración de caché de productos GestoPago
gestopago.cache.ttl-horas=1

# Puerto y dirección del servidor web (Render inyecta PORT=10000)
server.port=${PORT:10000}
server.address=0.0.0.0

# Timeout de sesión de inactividad: 5 minutos (300 segundos)
server.servlet.session.timeout=300
spring.session.timeout=300s
app.security.session-ttl-seconds=${APP_SESSION_TTL_SECONDS:300}

# Configuración de Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.display-request-duration=true

# Serialización de fechas: nunca usar timestamps, usar formato texto yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd

# Evitar que Jackson convierta Strings a Números automáticamente (forzar formato JSON estricto)
spring.jackson.mapper.allow-coercion-of-scalars=false

server.forward-headers-strategy=framework

# ==============================================================================
# Configuración Brevo (Envío de comprobantes de pago de servicios y recargas)
# ==============================================================================
brevo.api.url=${BREVO_API_URL:https://api.brevo.com}
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:}
brevo.sender.name=Banco Digital - Pagos y Recargas

# ==============================================================================
# Configuración Operativa Comercial
# ==============================================================================
app.redis.enabled=${APP_REDIS_ENABLED:false}
management.health.redis.enabled=${APP_REDIS_ENABLED:false}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8085,http://localhost:3000}
app.security.expose-otp-in-response=${APP_EXPOSE_OTP_IN_RESPONSE:false}
app.onboarding.saldo-inicial=${APP_ONBOARDING_SALDO_INICIAL:200.00}
