# SonarQube Project Configuration
sonar.projectKey=prueba_aplicaciones_web_progresivas
sonar.projectName=Prueba Aplicaciones Web Progresivas
sonar.projectVersion=1.0

sonar.host.url=http://localhost:9000

sonar.sources=src/main/java,frontend-web/src,mobile-flutter/lib
sonar.tests=src/test/java,frontend-web/src/__tests__,mobile-flutter/test
sonar.java.binaries=build/classes/java/main
sonar.sourceEncoding=UTF-8

# Cobertura Multi-Módulo (Backend JaCoCo + Web LCOV + Mobile LCOV)
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
sonar.javascript.lcov.reportPaths=frontend-web/coverage/lcov.info
sonar.dart.lcov.reportPaths=mobile-flutter/coverage/lcov.info

# Exclusiones de análisis general (DTOs, Entidades, Enums y artefactos generados)
sonar.exclusions=**/App.java,**/model/**,**/entity/**,**/enums/**,**/node_modules/**,**/dist/**,**/coverage/**,mobile-flutter/build/**,mobile-flutter/.dart_tool/**

# Exclusiones de cobertura (M1 mide controller, security, config, exception, util y service)
sonar.coverage.exclusions=**/App.java,**/model/**,**/entity/**,**/enums/**,**/client/**,**/repositorys/**,**/mapper/**,**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*_test.dart
